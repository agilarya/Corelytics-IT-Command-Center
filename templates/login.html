<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Corelytics Command Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            background: radial-gradient(circle at top left, #1e293b, #0f172a);
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden;
        }
        /* Efek Ornamen Latar Belakang */
        .bg-shape-1 {
            position: absolute; width: 400px; height: 400px; background: rgba(59, 130, 246, 0.15);
            border-radius: 50%; filter: blur(80px); top: -100px; left: -100px; z-index: -1;
        }
        .bg-shape-2 {
            position: absolute; width: 300px; height: 300px; background: rgba(249, 115, 22, 0.1);
            border-radius: 50%; filter: blur(60px); bottom: -50px; right: -50px; z-index: -1;
        }
        /* Glassmorphism Card */
        .login-card { 
            max-width: 420px; 
            width: 100%; 
            padding: 2.5rem; 
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            color: #f8fafc;
        }
        .form-control, .input-group-text {
            background-color: rgba(0, 0, 0, 0.2) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: #f8fafc !important;
            border-radius: 12px;
            padding: 0.8rem 1rem;
        }
        .form-control:focus {
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
            border-color: #3b82f6 !important;
        }
        .btn-modern {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: none;
            border-radius: 12px;
            padding: 0.8rem;
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-modern:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(59, 130, 246, 0.6);
        }
    </style>
</head>
<body>
    <div class="bg-shape-1"></div>
    <div class="bg-shape-2"></div>

    <div class="login-card">
        <div class="text-center mb-5">
            <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 20px; display: inline-block; margin-bottom: 15px;">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" height="50" style="filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));">
            </div>
            <h4 class="fw-bold mb-1" style="color: #fff; letter-spacing: -0.5px;">Corelytics</h4>
            <p style="color: #94a3b8; font-size: 0.9rem;">IT Command Center Access</p>
        </div>

        {% if error %}
            <div class="alert alert-danger" style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: #fca5a5; border-radius: 12px; font-size: 0.9rem;">
                <i class="fa-solid fa-triangle-exclamation me-2"></i>{{ error }}
            </div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="mb-4">
                <label class="form-label" style="color: #94a3b8; font-size: 0.85rem; font-weight: 500;">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-user text-muted"></i></span>
                    <input type="text" class="form-control" name="username" placeholder="Enter username" required>
                </div>
            </div>
            <div class="mb-5">
                <label class="form-label" style="color: #94a3b8; font-size: 0.85rem; font-weight: 500;">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock text-muted"></i></span>
                    <input type="password" class="form-control" name="password" placeholder="••••••••" required>
                </div>
            </div>
            <button type="submit" class="btn w-100 btn-modern">
                Sign In <i class="fa-solid fa-arrow-right ms-2"></i>
            </button>
        </form>
    </div>
</body>
</html>
